# ─── SI3LN Python – Docker Compose ──────────────────────────────────────────
#
# Services:
#   db           – PostgreSQL 15
#   redis        – Redis 7
#   api          – Django 4.2 + Django Ninja  →  http://localhost:8000
#                  Swagger UI                 →  http://localhost:8000/api/docs
#                  Django admin               →  http://localhost:8000/admin/
#   frontend     – Nginx (static SPA + reverse proxy)  →  http://localhost
#   game-builder – Pygbag build (profile: game)
#                  Run once:  docker compose --profile game up game-builder
#
# Quick start:
#   cd SI3LN_Python
#   docker compose -f Docker/docker-compose.yml up --build
#
# Play the browser game (first time):
#   docker compose -f Docker/docker-compose.yml --profile game up game-builder
#   # then restart frontend so nginx sees the new volume:
#   docker compose -f Docker/docker-compose.yml restart frontend

name: si3ln_python

networks:
  si3ln-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  pygbag_output:
  staticfiles:
  media:

services:

  # ── PostgreSQL 15 ──────────────────────────────────────────────────────────
  # NOTE: env_file is intentionally NOT used here – only postgres-specific vars
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB:       si3ln_db
      POSTGRES_USER:     si3ln_user
      POSTGRES_PASSWORD: si3ln_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U si3ln_user -d si3ln_db"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s   # give postgres time to init on first run
    networks:
      - si3ln-network

  # ── Redis 7 ───────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - si3ln-network

  # ── Django API ────────────────────────────────────────────────────────────
  api:
    build:
      context: ../api
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: ../env/.env
    environment:
      # These override the env_file values with Docker-internal hostnames
      DATABASE_URL: "postgresql://si3ln_user:si3ln_password@db:5432/si3ln_db"
      REDIS_URL:    "redis://redis:6379/0"
    ports:
      - "8000:8000"
    volumes:
      - staticfiles:/app/staticfiles
      - media:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - si3ln-network

  # ── Nginx frontend ────────────────────────────────────────────────────────
  frontend:
    image: nginx:1.25-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ../web_dashboard:/usr/share/nginx/html:ro
      - ../web_dashboard/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ../Game_Python/assets:/game_assets:ro
      - pygbag_output:/pygbag_data:ro
    depends_on:
      - api
    networks:
      - si3ln-network

  # ── Pygbag game builder (run once, then restart frontend) ─────────────────
  # Usage: docker compose --profile game up game-builder
  game-builder:
    profiles:
      - game
    build:
      context: ../Game_Python
      dockerfile: Dockerfile.pygbag
    volumes:
      - pygbag_output:/output
    networks:
      - si3ln-network
