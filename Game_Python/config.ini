# Configuration SI3LN Game
# Modifiez ces valeurs pour ajuster le jeu à vos préférences

# ===========================
# AFFICHAGE
# ===========================

# Résolution par défaut (largeur, hauteur)
SCREEN_WIDTH = 1280
SCREEN_HEIGHT = 720

# Démarrer en plein écran
START_FULLSCREEN = False

# Images par seconde (FPS)
FRAMES_PER_SECOND = 60

# ===========================
# GAMEPLAY
# ===========================

# Nombre de vies au départ
STARTING_LIVES = 5

# Vitesse du joueur (pixels par frame)
PLAYER_MOVEMENT_SPEED = 8

# Nombre maximum de bullets joueur à l'écran
MAX_PLAYER_BULLETS_ON_SCREEN = 3

# Vitesse des bullets joueur
PLAYER_BULLET_SPEED = 10

# Vitesse des bullets ennemis
ENEMY_BULLET_SPEED = 5

# Vitesse de base des ennemis
ENEMY_BASE_SPEED = 1

# Augmentation de difficulté par niveau (%)
DIFFICULTY_INCREASE_PER_LEVEL = 0.2

# ===========================
# SCORE
# ===========================

# Points de base par ennemi détruit
BASE_POINTS_PER_ENEMY = 10

# Multiplicateur du niveau (points = base × niveau)
LEVEL_SCORE_MULTIPLIER = True

# Nombre de meilleurs scores à afficher
TOP_SCORES_COUNT = 20

# ===========================
# INTERFACE
# ===========================

# Taille de l'icône de profil
PROFILE_ICON_SIZE = 60

# Durée d'affichage des messages (frames)
MESSAGE_DISPLAY_DURATION = 180  # 3 secondes à 60 FPS

# Rayon des coins arrondis des boutons
BUTTON_BORDER_RADIUS = 10

# ===========================
# AUDIO (NON IMPLÉMENTÉ)
# ===========================

# Activer la musique
MUSIC_ENABLED = False

# Volume de la musique (0.0 à 1.0)
MUSIC_VOLUME = 0.7

# Activer les effets sonores
SOUND_FX_ENABLED = False

# Volume des effets sonores (0.0 à 1.0)
SOUND_FX_VOLUME = 0.8

# ===========================
# DÉVELOPPEMENT
# ===========================

# Mode debug (affiche les rectangles de collision)
DEBUG_MODE = False

# Afficher le FPS à l'écran
SHOW_FPS = False

# Logs détaillés dans la console
VERBOSE_LOGGING = False

# ===========================
# SÉCURITÉ
# ===========================

# Longueur minimale du pseudo
MIN_USERNAME_LENGTH = 3

# Longueur maximale du pseudo
MAX_USERNAME_LENGTH = 20

# Longueur minimale du mot de passe
MIN_PASSWORD_LENGTH = 4

# Longueur maximale du mot de passe
MAX_PASSWORD_LENGTH = 50

# Longueur maximale de l'email
MAX_EMAIL_LENGTH = 100

# ===========================
# NOTES
# ===========================

# Pour appliquer ces changements:
# 1. Modifiez les valeurs ci-dessus
# 2. Copiez les valeurs dans constants.py
# 3. Relancez le jeu

# Certaines modifications nécessitent de modifier
# directement le code source pour prendre effet.
