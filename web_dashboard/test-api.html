<!DOCTYPE html>
<html>
<head>
    <title>API Test</title>
    <style>
        body { font-family: monospace; padding: 20px; }
        .test { margin: 10px 0; padding: 10px; border: 1px solid #ddd; }
        .success { background: #d4edda; }
        .error { background: #f8d7da; }
    </style>
</head>
<body>
    <h1>API Connectivity Test</h1>
    <div id="results"></div>
    
    <script>
        const results = document.getElementById('results');
        
        async function testEndpoint(name, url, options = {}) {
            const div = document.createElement('div');
            div.className = 'test';
            div.innerHTML = `<strong>${name}</strong> - Testing ${url}...<br>`;
            results.appendChild(div);
            
            try {
                const response = await fetch(url, options);
                const data = await response.text();
                div.innerHTML += `✅ Status: ${response.status}<br>Response: ${data.substring(0, 200)}`;
                div.classList.add('success');
            } catch (error) {
                div.innerHTML += `❌ Error: ${error.message}`;
                div.classList.add('error');
                console.error(name, error);
            }
        }
        
        // Run tests on page load
        window.addEventListener('DOMContentLoaded', async () => {
            console.log('Starting API tests...');
            
            await testEndpoint('Health Check', '/api/health');
            await testEndpoint('Stats', '/api/game/stats');
            await testEndpoint('Leaderboard', '/api/game/leaderboard');
            
            await testEndpoint('Login', '/api/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: 'admin', password: 'admin123' })
            });
            
            await testEndpoint('Register', '/api/auth/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ 
                    username: 'browsertest_' + Date.now(), 
                    email: 'test@example.com', 
                    password: 'test123' 
                })
            });
            
            console.log('Tests complete!');
        });
    </script>
</body>
</html>
