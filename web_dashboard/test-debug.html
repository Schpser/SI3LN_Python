<!DOCTYPE html>
<html>
<head>
    <title>Debug Test</title>
</head>
<body>
    <h1>Debug Test Page</h1>
    <button id="testBtn">Click Me!</button>
    <div id="output"></div>

    <script src="js/i18n.js"></script>
    <script src="api.js"></script>
    <script src="js/modules/profile.js"></script>
    <script src="js/modules/games.js"></script>
    <script src="js/modules/auth.js"></script>
    <script src="js/modules/help.js"></script>
    <script src="js/modules/mobile.js"></script>
    <script src="js/app-refactored.js"></script>

    <script>
        document.getElementById('testBtn').addEventListener('click', () => {
            const output = document.getElementById('output');
            output.innerHTML = '<h2>Test Results:</h2>';
            
            // Test 1: Check if window.app exists
            output.innerHTML += `<p>window.app exists: <strong>${window.app ? 'YES ✅' : 'NO ❌'}</strong></p>`;
            
            // Test 2: Check if API client exists
            output.innerHTML += `<p>window.api exists: <strong>${window.api ? 'YES ✅' : 'NO ❌'}</strong></p>`;
            
            // Test 3: Check if classes are defined
            output.innerHTML += `<p>ProfileManager defined: <strong>${typeof ProfileManager !== 'undefined' ? 'YES ✅' : 'NO ❌'}</strong></p>`;
            output.innerHTML += `<p>AuthManager defined: <strong>${typeof AuthManager !== 'undefined' ? 'YES ✅' : 'NO ❌'}</strong></p>`;
            output.innerHTML += `<p>GamesManager defined: <strong>${typeof GamesManager !== 'undefined' ? 'YES ✅' : 'NO ❌'}</strong></p>`;
            
            // Test 4: Try navigation
            if (window.app && window.app.navigateTo) {
                output.innerHTML += `<p>navigateTo function exists: <strong>YES ✅</strong></p>`;
            } else {
                output.innerHTML += `<p>navigateTo function exists: <strong>NO ❌</strong></p>`;
            }
        });
    </script>
</body>
</html>
