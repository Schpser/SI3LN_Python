server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    resolver 127.0.0.11 valid=10s ipv6=off;

    # WSL2 / Docker bind-mount fix: sendfile() drops connections on some files
    sendfile        off;
    tcp_nopush      off;
    tcp_nodelay     on;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css text/javascript application/javascript application/json;

    # ── JS files — explicit ^~ prefix, no regex interference ─────────────────
    # ^~ means: if this prefix wins, skip all regex location checks.
    # This guarantees /js/modules/*.js are served directly from the html root.
    location ^~ /js/ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control            "public, immutable"  always;
        add_header Cross-Origin-Resource-Policy "same-origin"    always;
    }

    # ── CSS files — same treatment ────────────────────────────────────────────
    location ^~ /css/ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control            "public, immutable"  always;
        add_header Cross-Origin-Resource-Policy "same-origin"    always;
    }

    # ── Game assets (Game_Python/assets mounted at /game_assets) ─────────────
    location ^~ /assets/ {
        alias /game_assets/;
        expires 1d;
        add_header Cache-Control            "public, must-revalidate" always;
        add_header Cross-Origin-Resource-Policy "cross-origin"   always;
    }

    # ── Pygbag raw output ─────────────────────────────────────────────────────
    location ^~ /pygbag/ {
        alias /pygbag_data/;
        index index.html;
        try_files $uri $uri/index.html =404;
        # sendfile already off globally; large-file tuning for 24 MB game.tar.gz
        output_buffers  4 512k;
        postpone_output 0;
        add_header Cross-Origin-Opener-Policy   "same-origin"    always;
        add_header Cross-Origin-Embedder-Policy "credentialless" always;
        add_header Cross-Origin-Resource-Policy "cross-origin"   always;
        gzip off;
    }

    # ── Pygbag CDN proxy ──────────────────────────────────────────────────────
    location ^~ /pygbag-cdn/ {
        set $pygbag_host pygame-web.github.io;
        proxy_pass https://$pygbag_host/archives/0.9/;
        proxy_ssl_server_name on;
        proxy_set_header Host $pygbag_host;
        proxy_set_header Accept-Encoding "";
        proxy_hide_header Cross-Origin-Resource-Policy;
        proxy_hide_header Cross-Origin-Embedder-Policy;
        add_header Cross-Origin-Resource-Policy "cross-origin"   always;
        add_header Cross-Origin-Embedder-Policy "credentialless" always;
        add_header Access-Control-Allow-Origin  "*"              always;
    }

    # ── API / admin / static → Django backend ────────────────────────────────
    location ^~ /api/ {
        set $upstream api;
        proxy_pass http://$upstream:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout    120s;
        proxy_connect_timeout 10s;
        proxy_buffering off;
    }

    location ^~ /admin/ {
        set $upstream api;
        proxy_pass http://$upstream:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout    120s;
        proxy_buffering off;
    }

    location ^~ /static/ {
        set $upstream api;
        proxy_pass http://$upstream:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── SPA catch-all ─────────────────────────────────────────────────────────
    # Handles index.html, api.js, game/, locales/, images not in /assets/, etc.
    # index.html gets no-cache; other files get moderate cache.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cross-Origin-Opener-Policy   "same-origin"    always;
        add_header Cross-Origin-Embedder-Policy "credentialless" always;
        add_header Cross-Origin-Resource-Policy "same-origin"    always;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }
}
