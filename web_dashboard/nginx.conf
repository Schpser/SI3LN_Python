server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    resolver 127.0.0.11 valid=10s ipv6=off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css text/javascript application/javascript application/json;

    # ── SPA + custom game wrapper ─────────────────────────────────────────────
    # COEP credentialless so the /pygbag/ iframe inside /game/ can use
    # SharedArrayBuffer via cross-origin isolation.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cross-Origin-Opener-Policy   "same-origin"    always;
        add_header Cross-Origin-Embedder-Policy "credentialless" always;
        add_header Cross-Origin-Resource-Policy "same-origin"    always;
    }

    # ── Pygbag raw output (Docker volume pygbag_output → /pygbag/) ───────────
    # CORP: cross-origin because Pygbag's own runtime embeds CDN iframes.
    # credentialless COEP so CDN subresources load without blocking.
    location ^~ /pygbag/ {
        alias /pygbag_data/;
        index index.html;
        try_files $uri $uri/index.html =404;
        add_header Cross-Origin-Opener-Policy   "same-origin"    always;
        add_header Cross-Origin-Embedder-Policy "credentialless" always;
        add_header Cross-Origin-Resource-Policy "cross-origin"   always;
        gzip off;
    }

    # ── Proxy Pygbag CDN resources through nginx ──────────────────────────────
    # Adds the CORP: cross-origin header that pygame-web.github.io omits,
    # fixing the "empty.html blocked" COEP error.
    location ^~ /pygbag-cdn/ {
        # use a variable to avoid resolving the host at startup; the DNS
        # lookup will happen on each request and will tolerate temporary
        # network failures during container boot.
        set $pygbag_host pygame-web.github.io;
        proxy_pass https://$pygbag_host/archives/0.9/;
        proxy_ssl_server_name on;
        proxy_set_header Host $pygbag_host;
        proxy_set_header Accept-Encoding "";
        proxy_hide_header Cross-Origin-Resource-Policy;
        proxy_hide_header Cross-Origin-Embedder-Policy;
        add_header Cross-Origin-Resource-Policy "cross-origin"   always;
        add_header Cross-Origin-Embedder-Policy "credentialless" always;
        add_header Access-Control-Allow-Origin  "*"              always;
    }

    # ── API / admin / static → Django backend ────────────────────────────────
    location ^~ /api/ {
        set $upstream api;
        proxy_pass http://$upstream:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location ^~ /admin/ {
        set $upstream api;
        proxy_pass http://$upstream:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location ^~ /static/ {
        set $upstream api;
        proxy_pass http://$upstream:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
    }
}
