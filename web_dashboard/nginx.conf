server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Allow uploads up to 10MB (avatar images, etc.)
    client_max_body_size 10m;

    resolver 127.0.0.11 valid=10s ipv6=off;

    # WSL2 / Docker bind-mount fix: sendfile() drops connections on some files
    sendfile        off;
    tcp_nopush      off;
    tcp_nodelay     on;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css text/javascript application/javascript application/json;

    # ── JS files — explicit ^~ prefix, no regex interference ─────────────────
    # ^~ means: if this prefix wins, skip all regex location checks.
    # This guarantees /js/modules/*.js are served directly from the html root.
    location ^~ /js/ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control            "public, immutable"  always;
        add_header Cross-Origin-Resource-Policy "same-origin"    always;
    }

    # ── CSS files — same treatment ────────────────────────────────────────────
    location ^~ /css/ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control            "public, immutable"  always;
        add_header Cross-Origin-Resource-Policy "same-origin"    always;
    }

    # ── Game assets (Game_Python/assets mounted at /game_assets) ─────────────
    location ^~ /assets/ {
        alias /game_assets/;
        expires 1d;
        add_header Cache-Control            "public, must-revalidate" always;
        add_header Cross-Origin-Resource-Policy "cross-origin"   always;
    }

    # ── Local pygbag dependencies (browserfs etc.) ─────────────────────────────
    # Serves files we host locally because the upstream CDN no longer has them.
    location ^~ /pygbag-local/ {
        root /usr/share/nginx/html;
        expires 30d;
        add_header Cache-Control            "public, immutable"  always;
        add_header Cross-Origin-Resource-Policy "cross-origin"   always;
        add_header Cross-Origin-Embedder-Policy "credentialless" always;
        add_header X-Content-Type-Options   "nosniff"            always;
    }

    # ── Pygbag raw output ─────────────────────────────────────────────────────
    location ^~ /pygbag/ {
        alias /pygbag_data/;
        index index.html;
        try_files $uri $uri/index.html =404;
        # sendfile already off globally; large-file tuning for 24 MB game.tar.gz
        output_buffers  4 512k;
        postpone_output 0;
        add_header Cross-Origin-Opener-Policy   "same-origin"    always;
        add_header Cross-Origin-Embedder-Policy "credentialless" always;
        add_header Cross-Origin-Resource-Policy "cross-origin"   always;
        add_header X-Content-Type-Options       "nosniff"        always;
        gzip off;

        # ── Rewrite pygbag CDN references ────────────────────────────────────
        # pygbag 0.9.3 hardcodes pygame-web.github.io URLs but:
        #   • browserfs.min.js was intentionally removed from the CDN (issue #218)
        #   • empty.html and pythons.js exist but lack CORP headers → blocked by COEP
        # Fix: strip the dead browserfs script tag entirely,
        #       rewrite empty.html → local copy,
        #       rewrite pythons.js → our CORP-aware CDN proxy,
        #       inject <!DOCTYPE html> to prevent Quirks Mode.
        sub_filter_once off;
        sub_filter_types text/html;

        # 1. Remove the dead browserfs script tag (file deliberately removed from CDN)
        sub_filter '<script src="https://pygame-web.github.io/cdn/0.9.3//browserfs.min.js"></script>' '<!-- browserfs removed from CDN (pygbag #218) -->';

        # 2. Rewrite empty.html → local copy (avoids COEP block)
        sub_filter 'https://pygame-web.github.io/cdn/0.9.3/empty.html' '/pygbag-local/empty.html';

        # 3. Rewrite pythons.js → CDN proxy (adds CORP header)
        sub_filter 'https://pygame-web.github.io/cdn/0.9.3/pythons.js' '/pygbag-cdn/pythons.js';

        # 4. Rewrite the JS config cdn base URL so ALL runtime fetches
        #    (wasm, wheels, etc.) go through our proxy with CORP headers
        sub_filter 'cdn : "https://pygame-web.github.io/cdn/0.9.3/"' 'cdn : "/pygbag-cdn/"';

        # 5. Inject doctype + Dark Reader lock to prevent Quirks Mode and
        #    stop Dark Reader from breaking canvas rendering
        sub_filter '<html lang="en-us">' '<!DOCTYPE html><html lang="en-us"><head><meta name="darkreader-lock"><meta name="color-scheme" content="only light">';
    }

    # ── Pygbag CDN proxy ──────────────────────────────────────────────────────
    # NOTE: when a variable is used in proxy_pass, nginx does NOT rewrite the
    # request URI automatically.  We must use an explicit rewrite rule to map
    # /pygbag-cdn/<path> → /cdn/0.9.3/<path> on the upstream.
    location ^~ /pygbag-cdn/ {
        set $pygbag_host pygame-web.github.io;
        rewrite ^/pygbag-cdn/(.*) /cdn/0.9.3/$1 break;
        proxy_pass https://$pygbag_host;
        proxy_ssl_server_name on;
        proxy_set_header Host $pygbag_host;
        proxy_set_header Accept-Encoding "";
        proxy_hide_header Cross-Origin-Resource-Policy;
        proxy_hide_header Cross-Origin-Embedder-Policy;
        add_header Cross-Origin-Resource-Policy "cross-origin"   always;
        add_header Cross-Origin-Embedder-Policy "credentialless" always;
        add_header Access-Control-Allow-Origin  "*"              always;
    }

    # ── Media files (user uploads: avatars, etc.) → Django backend ────────────
    location ^~ /media/ {
        set $upstream api;
        proxy_pass http://$upstream:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 7d;
        add_header Cache-Control            "public, must-revalidate" always;
    }

    # ── API / admin / static → Django backend ────────────────────────────────
    location ^~ /api/ {
        set $upstream api;
        proxy_pass http://$upstream:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout    120s;
        proxy_connect_timeout 10s;
        proxy_buffering off;
    }

    location ^~ /admin/ {
        set $upstream api;
        proxy_pass http://$upstream:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout    120s;
        proxy_buffering off;
    }

    location ^~ /static/ {
        set $upstream api;
        proxy_pass http://$upstream:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Game page (loaded inside SPA iframe) ──────────────────────────────────
    # Needs relaxed CORP so the iframe can fetch pygbag assets cross-origin.
    location ^~ /game/ {
        root /usr/share/nginx/html;
        try_files $uri $uri/ =404;
        add_header Cross-Origin-Opener-Policy   "same-origin"      always;
        add_header Cross-Origin-Embedder-Policy "credentialless"   always;
        add_header Cross-Origin-Resource-Policy "cross-origin"     always;
        add_header X-Content-Type-Options       "nosniff"          always;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    # ── SPA catch-all ─────────────────────────────────────────────────────────
    # Handles index.html, api.js, game/, locales/, images not in /assets/, etc.
    # index.html gets no-cache; other files get moderate cache.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cross-Origin-Opener-Policy   "same-origin"    always;
        add_header Cross-Origin-Embedder-Policy "credentialless" always;
        add_header Cross-Origin-Resource-Policy "same-origin"    always;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;

        # Cross-browser compatibility headers
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
}
